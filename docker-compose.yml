services:
  bot:
    build: playmen/gift:prod1
    container_name: bot
    restart: on-failure
    ports:
      - "2345:2345"
    depends_on:
      - db

  db:
    image: postgres:17-bookworm
    container_name: postgres17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: